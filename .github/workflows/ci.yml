name: Lumina CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

# Two INDEPENDENT jobs on purpose: a release failure must never block or
# destroy the debug artifact. Release publishes diagnostics when it fails.
# The schema job enforces committed Room schemas: export must match main.
jobs:
  schema:
    name: Room schema drift check
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept licenses and install platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;36.0.0"

      # Room exports app/schemas/*.json during annotation processing. This
      # regenerates them from the current entities; the drift check below
      # fails unless the result matches what is committed.
      - name: Export Room schemas
        run: chmod +x gradlew && ./gradlew :app:kspDebugKotlin --console=plain

      - name: Upload exported schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/*.json
          if-no-files-found: warn

      # Schema drift must be committed deliberately, never slip in silently.
      - name: Fail on schema drift
        run: |
          DRIFT="$(git status --porcelain -- app/schemas)"
          if [ -n "$DRIFT" ]; then
            echo "Room schema drift detected (commit the exported schemas):"
            echo "$DRIFT"
            exit 1
          fi

  debug:
    name: Debug APK + unit tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept licenses and install platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;36.0.0"

      - name: Assemble debug
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --console=plain

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumina-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Release assemble (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept licenses and install platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;36.0.0"

      # --stacktrace/--info on purpose: AGP's packageRelease wraps the worker
      # failure, and the useful "Caused by" is invisible without them.
      - name: Assemble release (unsigned)
        run: ./gradlew :app:assembleRelease --console=plain --stacktrace --info

      # Unsigned and NOT distributable: signing happens outside CI until a
      # signingConfig + secret store exist. Do not ship this artifact.
      - name: Upload release APK (unsigned)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumina-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics
          path: |
            app/build/reports/**
            app/build/intermediates/**
            app/build/outputs/**
          if-no-files-found: ignore
name: Lumina CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept licenses and install platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;36.0.0"

      - name: Assemble debug
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --console=plain --max-workers=1

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --max-workers=1

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain --max-workers=1

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumina-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
